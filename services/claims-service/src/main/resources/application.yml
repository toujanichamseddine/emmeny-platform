spring:
  application:
    name: claims-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/emmeny_claims}

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs