spring:
  application:
    name: identity-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/emmeny_identity}
      auto-index-creation: true

server:
  port: 8081

app:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs