services:
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/emmeny_identity
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy

  insurance-service:
    build:
      context: .
      dockerfile: services/insurance-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/emmeny_insurance
    ports:
      - "8082:8082"
    depends_on:
      mongo:
        condition: service_healthy

  policy-service:
    build:
      context: .
      dockerfile: services/policy-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/emmeny_policy
    ports:
      - "8083:8083"
    depends_on:
      mongo:
        condition: service_healthy

  claims-service:
    build:
      context: .
      dockerfile: services/claims-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/emmeny_claims
    ports:
      - "8084:8084"
    depends_on:
      mongo:
        condition: service_healthy

  assistance-service:
    build:
      context: .
      dockerfile: services/assistance-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/emmeny_assistance
    ports:
      - "8085:8085"
    depends_on:
      mongo:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/emmeny_payment
    ports:
      - "8086:8086"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data: